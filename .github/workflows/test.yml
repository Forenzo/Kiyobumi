name: Source checks
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --release --manifest-path rust/Cargo.toml --locked
      - run: python scripts/test-import.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-macos.sh --test
