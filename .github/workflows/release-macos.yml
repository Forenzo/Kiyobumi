name: Prebuilt macOS release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prebuilt-v0.7.10
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.7.10
      - name: Build tagged source and run Rust tests
        run: ./scripts/build-macos.sh
      - name: Record Swift test results
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set +e
          xcrun swift test --build-system native --scratch-path "$PWD/.build/kiyobumi-native" --sdk "$(xcrun --sdk macosx --show-sdk-path)" > "Kiyobumi-0.7.10-macos-$ARCH-tests.txt" 2>&1
          result=$?
          cat "Kiyobumi-0.7.10-macos-$ARCH-tests.txt"
          echo "Swift test exit status: $result" >> "Kiyobumi-0.7.10-macos-$ARCH-tests.txt"
          if [ "$result" -ne 0 ]; then
            echo "::warning::Swift tests failed; see attached test report. The known detached-editor lifetime assertion is unresolved."
          fi
      - name: Verify bundle and package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=dist/Kiyobumi.app
          test "$(uname -m)" = "$ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.7.10
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in "$app/Contents/MacOS/Kiyobumi" "$app/Contents/Resources/one-import"; do
            lipo -verify_arch "$ARCH" "$binary"
            otool -L "$binary"
            if otool -L "$binary" | grep -E '/(Users|opt/homebrew|usr/local)/'; then
              echo "Non-system runtime dependency found" >&2
              exit 1
            fi
          done
          ditto -c -k --sequesterRsrc --keepParent "$app" "Kiyobumi-0.7.10-macos-$ARCH.zip"
          shasum -a 256 "Kiyobumi-0.7.10-macos-$ARCH.zip" > "Kiyobumi-0.7.10-macos-$ARCH.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Kiyobumi-0.7.10-macos-${{ matrix.arch }}
          path: Kiyobumi-0.7.10-macos-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Kiyobumi-0.7.10-macos-*
          merge-multiple: true
          path: packages
      - name: Attach verified packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.10 --repo "$GITHUB_REPOSITORY"
          gh release upload v0.7.10 packages/* --repo "$GITHUB_REPOSITORY" --clobber
